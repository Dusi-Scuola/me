name: X Post Checker Cron

on:
  schedule:
    # Esegue ogni 5 minuti (il minimo ideale per non sovraccaricare GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette anche di avviarlo a mano da GitHub per fare test

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    # IMPORTANTE: Permette a GitHub Actions di salvare e pushare il file last_tweet.json nel repository
    permissions:
      contents: write

    steps:
      - name: Controlla il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script Bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # AGGIUNTA: Passa le credenziali dell'account finto di X allo script Python
          TW_USERNAME: ${{ secrets.TW_USERNAME }}
          TW_PASSWORD: ${{ secrets.TW_PASSWORD }}
          TW_EMAIL: ${{ secrets.TW_EMAIL }}
          TW_EMAIL_PASSWORD: ${{ secrets.TW_EMAIL_PASSWORD }}
        run: python bot.py

      - name: Salva l'ultimo ID nel repository (Evita duplicati alla prossima esecuzione)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add last_tweet.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornato ID ultimo tweet [skip ci]" && git push)
